<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Urna Eletrônica - Cidade Alta RP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#252525;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
}
.urna{
 width:420px;
 max-width:95%;
 background:#bcbcbc;
 padding:22px;
 border-radius:8px;
 box-shadow:0 10px 30px #000;
 border:2px solid #888;
}
.topo{
 background:#222;
 color:white;
 padding:8px;
 text-align:center;
 font-weight:bold;
 border-radius:4px 4px 0 0;
}
.tela{
 background:#e9e9e9;
 min-height:330px;
 border:12px solid #171717;
 padding:20px;
 position:relative;
}
.titulo{
 font-size:17px;
 font-weight:bold;
 margin-bottom:20px;
}
.cargo{
 font-size:14px;
 margin-bottom:12px;
}
.numero{
 font-size:30px;
 letter-spacing:5px;
 border-bottom:2px solid #555;
 min-height:42px;
}
.info{
 margin-top:20px;
 min-height:110px;
}
.foto{
 width:90px;
 height:110px;
 object-fit:cover;
 float:right;
 border:1px solid #555;
 display:none;
}
.msg{
 margin-top:18px;
 font-size:14px;
}
.teclas{
 margin-top:18px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}
button{
 border:0;
 border-radius:5px;
 padding:16px 5px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 3px 0 #111;
}
.num{
 background:#151515;
 color:white;
}
.branco{background:#eee;color:#111}
.corrige{background:#e6b400;color:#111}
.confirma{background:#168a42;color:white}
button:active{
 transform:translateY(3px);
 box-shadow:none;
}
.inicio{
 text-align:center;
}
.inicio button{
 background:#168a42;
 color:white;
 width:100%;
 margin-top:15px;
}
.erro{
 color:#b00000;
 font-weight:bold;
}
.sucesso{
 text-align:center;
 font-size:20px;
 font-weight:bold;
 margin-top:80px;
}
.id{
 font-size:11px;
 color:#555;
 position:absolute;
 bottom:5px;
 right:8px;
}
</style>
</head>

<body>

<div class="urna">

<div class="topo">CIDADE ALTA RP • URNA ELETRÔNICA</div>

<div class="tela" id="tela">

<div class="inicio" id="inicio">
<h2>ELEIÇÕES 2026</h2>
<p>Urna pronta para votação.</p>
<p id="statusEleicao"></p>
<button onclick="iniciar()">ABRIR URNA</button>
</div>

</div>

<div class="teclas" id="teclas" style="display:none">

<button class="num" onclick="tecla('1')">1</button>
<button class="num" onclick="tecla('2')">2</button>
<button class="num" onclick="tecla('3')">3</button>

<button class="num" onclick="tecla('4')">4</button>
<button class="num" onclick="tecla('5')">5</button>
<button class="num" onclick="tecla('6')">6</button>

<button class="num" onclick="tecla('7')">7</button>
<button class="num" onclick="tecla('8')">8</button>
<button class="num" onclick="tecla('9')">9</button>

<button class="branco" onclick="branco()">BRANCO</button>
<button class="num" onclick="tecla('0')">0</button>
<button class="corrige" onclick="corrige()">CORRIGE</button>

<button class="confirma" style="grid-column:span 3" onclick="confirma()">CONFIRMA</button>

</div>

</div>

<script>

/* =========================
   SOM DA URNA
========================= */

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function som(freq,duracao,tipo="square"){
    try{
        if(audioCtx.state==="suspended") audioCtx.resume();

        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();

        osc.type=tipo;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(0.08,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime+duracao
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duracao);
    }catch(e){}
}

function somTecla(){
    som(650,0.08);
}

function somConfirma(){
    som(850,0.12);
    setTimeout(()=>som(1100,0.15),100);
}

function somErro(){
    som(180,0.18,"sawtooth");
}

function somSucesso(){
    som(700,0.12);
    setTimeout(()=>som(900,0.12),130);
    setTimeout(()=>som(1200,0.20),260);
}

/* =========================
   CONFIGURAÇÃO
========================= */

const etapas=[
    {cargo:"federal",titulo:"DEPUTADO FEDERAL",digitos:4},
    {cargo:"estadual",titulo:"DEPUTADO ESTADUAL",digitos:5},
    {cargo:"senador1",titulo:"1º SENADOR",digitos:3},
    {cargo:"senador2",titulo:"2º SENADOR",digitos:3},
    {cargo:"governador",titulo:"GOVERNADOR",digitos:2},
    {cargo:"presidente",titulo:"PRESIDENTE",digitos:2}
];

let etapa=0;
let numero="";
let candidatoAtual=null;
let votoAtual={};

/* =========================
   STATUS DA ELEIÇÃO
========================= */

const status=localStorage.getItem("cidadeAltaEleicaoStatus");

if(status==="encerrada"){
    document.getElementById("statusEleicao").innerHTML=
    '<span class="erro">ELEIÇÃO ENCERRADA</span>';
}

/* =========================
   INICIAR
========================= */

function iniciar(){

    somConfirma();

    if(localStorage.getItem("cidadeAltaEleicaoStatus")==="encerrada"){
        alert("A eleição está encerrada.");
        return;
    }

    if(localStorage.getItem("cidadeAltaJaVotou2026")==="true"){
        alert("Este dispositivo já registrou um voto.");
        return;
    }

    document.getElementById("inicio").style.display="none";
    document.getElementById("teclas").style.display="grid";

    mostrarEtapa();
}

/* =========================
   MOSTRAR ETAPA
========================= */

function mostrarEtapa(){

    numero="";
    candidatoAtual=null;

    const e=etapas[etapa];

    document.getElementById("tela").innerHTML=`
        <div class="titulo">SEU VOTO</div>
        <div class="cargo">${e.titulo}</div>

        <div class="numero" id="numero"></div>

        <div class="info" id="info">
            Digite o número do candidato.
        </div>

        <div class="id">
            CIDADE ALTA RP
        </div>
    `;
}

/* =========================
   TECLADO
========================= */

function tecla(n){

    somTecla();

    const e=etapas[etapa];

    if(numero.length>=e.digitos) return;

    numero+=n;

    document.getElementById("numero").textContent=numero;

    procurar();
}

/* =========================
   PROCURAR CANDIDATO
========================= */

function procurar(){

    if(numero.length!==etapas[etapa].digitos) return;

    const candidatos=
        JSON.parse(localStorage.getItem("candidatosCidadeAlta")||"{}");

    let cargo=etapas[etapa].cargo;

    if(cargo==="senador1" || cargo==="senador2"){
        cargo="senador";
    }

    const chave=cargo+"_"+numero;

    candidatoAtual=candidatos[chave]||null;

    const info=document.getElementById("info");

    if(!candidatoAtual){

        info.innerHTML=
        '<span class="erro">NÚMERO NÃO ENCONTRADO</span>';

        somErro();

        return;
    }

    let foto="";

    if(candidatoAtual.foto){
        foto=`
        <img
        src="${candidatoAtual.foto}"
        class="foto"
        style="display:block"
        >
        `;
    }

    info.innerHTML=`
        ${foto}
        <b>NOME:</b> ${candidatoAtual.nome}<br>
        <b>PARTIDO:</b> ${candidatoAtual.partido}<br>
        <br>
        <b>CONFIRME SEU VOTO</b>
    `;
}

/* =========================
   CORRIGE
========================= */

function corrige(){

    somTecla();

    numero="";
    candidatoAtual=null;

    document.getElementById("numero").textContent="";
    document.getElementById("info").innerHTML=
    "Digite o número do candidato.";
}

/* =========================
   BRANCO
========================= */

function branco(){

    somTecla();

    votoAtual[etapas[etapa].cargo]="branco";

    avancar();
}

/* =========================
   CONFIRMA
========================= */

function confirma(){

    if(numero.length!==etapas[etapa].digitos){
        somErro();
        return;
    }

    if(!candidatoAtual){
        somErro();
        return;
    }

    somConfirma();

    const cargo=etapas[etapa].cargo;

    if(cargo==="senador2" &&
       votoAtual.senador1===numero){

        alert("Você não pode votar duas vezes no mesmo senador.");

        somErro();

        return;
    }

    votoAtual[cargo]=numero;

    avancar();
}

/* =========================
   AVANÇAR
========================= */

function avancar(){

    etapa++;

    if(etapa>=etapas.length){

        finalizar();

        return;
    }

    setTimeout(()=>{
        mostrarEtapa();
    },400);
}

/* =========================
   FINALIZAR
========================= */

function finalizar(){

    const votos=
        JSON.parse(localStorage.getItem("votosCidadeAlta")||"{}");

    const cargos=[
        "federal",
        "estadual",
        "senador1",
        "senador2",
        "governador",
        "presidente"
    ];

    cargos.forEach(cargo=>{

        if(!votos[cargo]) votos[cargo]={};

        if(!votos.brancos){
            votos.brancos={
                federal:0,
                estadual:0,
                senador1:0,
                senador2:0,
                governador:0,
                presidente:0
            };
        }

        if(!votos.nulos){
            votos.nulos={
                federal:0,
                estadual:0,
                senador1:0,
                senador2:0,
                governador:0,
                presidente:0
            };
        }

        const escolha=votoAtual[cargo];

        if(escolha==="branco"){

            votos.brancos[cargo]++;

        }else if(escolha){

            votos[cargo][escolha]=
                (votos[cargo][escolha]||0)+1;
        }

    });

    localStorage.setItem(
        "votosCidadeAlta",
        JSON.stringify(votos)
    );

    /*
      MARCA O DISPOSITIVO COMO JÁ VOTADO
      SOMENTE DEPOIS DOS 6 CARGOS
    */
    localStorage.setItem(
        "cidadeAltaJaVotou2026",
        "true"
    );

    somSucesso();

    document.getElementById("teclas").style.display="none";

    document.getElementById("tela").innerHTML=`
        <div class="sucesso">
            VOTO CONFIRMADO
            <br><br>
            Obrigado por votar.
            <br><br>
            <small>Você já não poderá votar novamente neste dispositivo.</small>
        </div>
    `;
}

</script>

</body>
</html>
